<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نتائج البحث | دكان</title>

  <!-- ============ Google Fonts: نفس نظام الخطوط المستخدم في باقي الموقع ============ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- ============ Tailwind CSS ============ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* نفس إعدادات نظام التصميم المستخدمة في باقي صفحات الموقع بالظبط */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0A0908',
            surface: '#15130F',
            surface2: '#1C1A14',
            bone: '#F5F1E8',
            muted: '#948E80',
            gold: {
              300: '#E8D488',
              400: '#D9BB55',
              500: '#C9A227',
              600: '#A8811C',
            },
            violet: {
              300: '#C4B5FD',
              400: '#A78BFA',
              500: '#8B5CF6',
            },
          },
          fontFamily: {
            display: ['Cairo', 'sans-serif'],
            body: ['Tajawal', 'sans-serif'],
            num: ['Inter', 'Tajawal', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- ============ Lucide Icons ============ -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- ============ نظام التصميم: تدرجات وحركات مساعدة ============ -->
  <style>
    body {
      background-color: #0A0908;
      background-image:
        radial-gradient(ellipse 900px 650px at 88% -8%, rgba(201, 162, 39, 0.10), transparent 60%),
        radial-gradient(ellipse 750px 550px at -8% 108%, rgba(139, 92, 246, 0.08), transparent 60%);
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    .glow-gold:hover {
      box-shadow: 0 0 28px rgba(201, 162, 39, 0.35);
    }

    ::selection {
      background: rgba(201, 162, 39, 0.35);
      color: #F5F1E8;
    }

    /* ============ إصلاح شكل القوائم المنسدلة (select) في المتصفح ============ */
    select { color-scheme: dark; }
    select option {
      background-color: #1C1A14;
      color: #F5F1E8;
    }

    /* ============ حركة انسدال قائمة الهمبرجر على الموبايل (نفس أسلوب باقي الموقع) ============ */
    #mobileMenu {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s ease;
    }
    #mobileMenu.open { grid-template-rows: 1fr; }
    #mobileMenu > div { overflow: hidden; }

    /* ============ درج الفلاتر المنسدل على الموبايل/التابلت ============ */
    #filterDrawer {
      transform: translateX(100%);
      transition: transform 0.35s ease;
    }
    #filterDrawer.open {
      transform: translateX(0);
    }
    #filterOverlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #filterOverlay.open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col text-bone font-body antialiased">

  <!-- =========================================================
       الهيدر Header (نفس مكوّن الهيدر في index.html للحفاظ على تجربة تصفح موحّدة)
       ========================================================= -->
  <header class="w-full sticky top-0 z-50 bg-ink/85 backdrop-blur-md border-b border-white/[0.06]">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4 flex-wrap md:flex-nowrap">
      <a href="index.html" class="flex items-center gap-2 shrink-0 group">
        <span class="text-2xl font-display font-extrabold text-bone group-hover:text-gold-400 transition-colors">دكان</span>
      </a>

      <div class="hidden md:flex flex-1 max-w-xl">
        <div class="w-full flex items-center bg-surface border border-white/10 rounded-lg px-3 py-2 focus-within:border-gold-500/60 transition-colors">
          <i data-lucide="search" class="w-5 h-5 shrink-0 text-muted"></i>
          <input id="searchInput" type="text" placeholder="ابحث عن منتج..." class="w-full outline-none px-2 bg-transparent placeholder:text-muted text-bone" />
        </div>
      </div>

      <div class="flex items-center gap-3 shrink-0">
        <button class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-lg font-display font-bold text-ink bg-gradient-to-l from-gold-400 to-gold-600 glow-gold transition-all hover:-translate-y-0.5">
          <i data-lucide="plus-circle" class="w-5 h-5"></i>
          <span>أضف منتجك</span>
        </button>
        <a href="auth.html" data-account-link class="p-2 rounded-lg border border-white/10 text-muted hover:text-gold-400 hover:border-gold-500/40 transition-colors flex items-center justify-center w-9 h-9" aria-label="الحساب">
          <i data-lucide="user" class="w-5 h-5"></i>
        </a>
        <button class="p-2 rounded-lg border border-white/10 text-muted hover:text-gold-400 md:hidden transition-colors" aria-label="فتح القائمة" id="menuToggle" aria-expanded="false" aria-controls="mobileMenu">
          <i data-lucide="menu" class="w-5 h-5" id="menuIcon"></i>
        </button>
      </div>
    </div>

    <div class="md:hidden px-4 pb-3">
      <div class="w-full flex items-center bg-surface border border-white/10 rounded-lg px-3 py-2">
        <i data-lucide="search" class="w-5 h-5 shrink-0 text-muted"></i>
        <input type="text" placeholder="ابحث عن منتج..." class="w-full outline-none px-2 bg-transparent placeholder:text-muted text-bone" />
      </div>
    </div>

    <div id="mobileMenu" class="md:hidden border-t border-white/[0.06]">
      <div>
        <ul class="max-w-7xl mx-auto px-4 pt-2 pb-1 flex flex-col text-sm">
          <li><a href="index.html" class="block px-2 py-2.5 rounded-lg text-muted hover:text-gold-400 hover:bg-white/5 transition-colors">الرئيسية</a></li>
          <li><a href="search.html" class="block px-2 py-2.5 rounded-lg text-muted hover:text-gold-400 hover:bg-white/5 transition-colors">كل المنتجات</a></li>
          <li><a href="auth.html" class="block px-2 py-2.5 rounded-lg text-muted hover:text-gold-400 hover:bg-white/5 transition-colors">تسجيل الدخول</a></li>
        </ul>
        <div class="max-w-7xl mx-auto px-4 pb-4 pt-2">
          <button class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg font-display font-bold text-ink bg-gradient-to-l from-gold-400 to-gold-600 glow-gold transition-all">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span>أضف منتجك</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- =========================================================
       المحتوى الرئيسي
       ========================================================= -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-8">

    <!-- مسار التنقل + عنوان الصفحة -->
    <div class="mb-6">
      <nav class="text-xs text-muted flex items-center gap-1.5 mb-3">
        <a href="index.html" class="hover:text-gold-400 transition-colors">الرئيسية</a>
        <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
        <span class="text-bone">نتائج البحث</span>
      </nav>
      <h1 class="text-2xl md:text-3xl font-display font-extrabold">كل المنتجات</h1>
      <p id="resultsCount" class="text-muted text-sm mt-1">عرض 12 منتج</p>
    </div>

    <div class="flex gap-8 items-start">

      <!-- ============ الشريط الجانبي للفلاتر (ديسكتوب) ============ -->
      <aside class="hidden lg:block w-72 shrink-0 sticky top-24">
        <div id="filterPanelDesktop"></div>
      </aside>

      <!-- ============ عمود النتائج ============ -->
      <div class="flex-1 min-w-0">

        <!-- شريط أدوات: زر فلاتر (موبايل) + الترتيب -->
        <div class="flex items-center justify-between gap-3 mb-5">
          <button id="openFilterDrawer" class="lg:hidden flex items-center gap-2 px-4 py-2.5 rounded-lg border border-white/10 bg-surface text-sm font-medium">
            <i data-lucide="sliders-horizontal" class="w-4 h-4 text-gold-400"></i>
            الفلاتر
            <span id="activeFilterCount" class="hidden w-5 h-5 rounded-full bg-gold-500 text-ink text-xs font-bold items-center justify-center"></span>
          </button>

          <div class="flex items-center gap-2 mr-auto">
            <label for="sortSelect" class="text-xs text-muted hidden sm:inline">ترتيب حسب</label>
            <select id="sortSelect" class="bg-surface border border-white/10 rounded-lg px-3 py-2 text-sm text-bone outline-none focus:border-gold-500/60">
              <option value="default">الأحدث</option>
              <option value="price-asc">السعر: من الأقل للأعلى</option>
              <option value="price-desc">السعر: من الأعلى للأقل</option>
            </select>
          </div>
        </div>

        <!-- رقاقات الفلاتر النشطة -->
        <div id="activeChips" class="flex flex-wrap gap-2 mb-5"></div>

        <!-- شبكة المنتجات -->
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
          <!-- سيتم توليد البطاقات ديناميكياً عبر JavaScript من مصفوفة بيانات تجريبية -->
        </div>

        <!-- حالة "لا توجد نتائج" -->
        <div id="emptyState" class="hidden flex-col items-center text-center py-16">
          <div class="w-14 h-14 rounded-full bg-surface border border-white/10 flex items-center justify-center mb-4">
            <i data-lucide="search-x" class="w-7 h-7 text-muted"></i>
          </div>
          <h3 class="font-display font-bold text-lg mb-1">مفيش نتائج مطابقة</h3>
          <p class="text-muted text-sm">جرب تغيّر الفلاتر أو تمسحها كلها وتبدأ من جديد</p>
        </div>

        <!-- ترقيم الصفحات (Pagination) -->
        <div class="flex items-center justify-center gap-2 mt-10">
          <button class="w-9 h-9 rounded-lg border border-white/10 text-muted hover:border-gold-500/40 hover:text-gold-400 transition-colors flex items-center justify-center" aria-label="الصفحة السابقة">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
          <button class="w-9 h-9 rounded-lg border border-gold-500/50 bg-gold-500/10 text-gold-400 font-num text-sm font-semibold">1</button>
          <button class="w-9 h-9 rounded-lg border border-white/10 text-muted hover:border-gold-500/40 hover:text-gold-400 transition-colors font-num text-sm">2</button>
          <button class="w-9 h-9 rounded-lg border border-white/10 text-muted hover:border-gold-500/40 hover:text-gold-400 transition-colors font-num text-sm">3</button>
          <button class="w-9 h-9 rounded-lg border border-white/10 text-muted hover:border-gold-500/40 hover:text-gold-400 transition-colors flex items-center justify-center" aria-label="الصفحة التالية">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
        </div>

      </div>
    </div>
  </main>

  <!-- ============ درج الفلاتر (موبايل/تابلت) ============ -->
  <div id="filterOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[90] lg:hidden"></div>
  <div id="filterDrawer" class="fixed top-0 bottom-0 right-0 w-[85%] max-w-sm bg-ink border-l border-white/10 z-[95] lg:hidden overflow-y-auto">
    <div class="flex items-center justify-between px-5 py-4 border-b border-white/[0.07] sticky top-0 bg-ink">
      <h2 class="font-display font-bold text-lg">الفلاتر</h2>
      <button id="closeFilterDrawer" class="p-2 rounded-lg border border-white/10 text-muted" aria-label="إغلاق الفلاتر">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    <div class="p-5">
      <div id="filterPanelMobile"></div>
    </div>
    <div class="p-5 border-t border-white/[0.07] sticky bottom-0 bg-ink">
      <button id="applyFilterDrawer" class="w-full px-6 py-3 rounded-lg font-display font-bold text-ink bg-gradient-to-l from-gold-300 to-gold-600 glow-gold transition-all">
        عرض النتائج
      </button>
    </div>
  </div>

  <!-- ============ قالب محتوى الفلاتر (يُستنسخ للنسخة الديسكتوب والموبايل) ============ -->
  <template id="filterTemplate">
    <div class="space-y-6">

      <!-- فلتر الحالة -->
      <div>
        <h3 class="font-display font-semibold text-sm mb-3">الحالة</h3>
        <div class="flex gap-2 flex-wrap condition-group">
          <button data-value="all" class="condition-btn px-3 py-1.5 rounded-full text-xs border transition-colors">الكل</button>
          <button data-value="new" class="condition-btn px-3 py-1.5 rounded-full text-xs border transition-colors">جديد</button>
          <button data-value="used" class="condition-btn px-3 py-1.5 rounded-full text-xs border transition-colors">مستعمل</button>
        </div>
      </div>

      <!-- فلتر الأقسام -->
      <div>
        <h3 class="font-display font-semibold text-sm mb-3">القسم</h3>
        <div class="space-y-2 category-group">
          <label class="flex items-center gap-2.5 text-sm text-muted cursor-pointer">
            <input type="checkbox" value="mobiles" class="category-check w-4 h-4 rounded border-white/20 bg-white/5 accent-gold-500" />
            موبايلات
          </label>
          <label class="flex items-center gap-2.5 text-sm text-muted cursor-pointer">
            <input type="checkbox" value="electronics" class="category-check w-4 h-4 rounded border-white/20 bg-white/5 accent-gold-500" />
            إلكترونيات
          </label>
          <label class="flex items-center gap-2.5 text-sm text-muted cursor-pointer">
            <input type="checkbox" value="furniture" class="category-check w-4 h-4 rounded border-white/20 bg-white/5 accent-gold-500" />
            أثاث ومنزل
          </label>
          <label class="flex items-center gap-2.5 text-sm text-muted cursor-pointer">
            <input type="checkbox" value="cars" class="category-check w-4 h-4 rounded border-white/20 bg-white/5 accent-gold-500" />
            سيارات
          </label>
          <label class="flex items-center gap-2.5 text-sm text-muted cursor-pointer">
            <input type="checkbox" value="fashion" class="category-check w-4 h-4 rounded border-white/20 bg-white/5 accent-gold-500" />
            أزياء
          </label>
        </div>
      </div>

      <!-- فلتر السعر -->
      <div>
        <h3 class="font-display font-semibold text-sm mb-3">نطاق السعر (جنيه)</h3>
        <div class="flex items-center gap-2">
          <input type="number" min="0" placeholder="من" class="price-min w-full rounded-lg px-3 py-2 bg-white/5 border border-white/10 text-sm text-bone outline-none focus:border-gold-500/60 font-num" />
          <span class="text-muted text-xs">إلى</span>
          <input type="number" min="0" placeholder="إلى" class="price-max w-full rounded-lg px-3 py-2 bg-white/5 border border-white/10 text-sm text-bone outline-none focus:border-gold-500/60 font-num" />
        </div>
      </div>

      <!-- فلتر المحافظة -->
      <div>
        <h3 class="font-display font-semibold text-sm mb-3">المحافظة</h3>
        <select class="location-select w-full rounded-lg px-3 py-2.5 bg-white/5 border border-white/10 text-sm text-bone outline-none focus:border-gold-500/60">
          <option value="all">كل المحافظات</option>
          <option value="cairo">القاهرة</option>
          <option value="giza">الجيزة</option>
          <option value="alex">الإسكندرية</option>
          <option value="dakahlia">الدقهلية</option>
          <option value="red_sea">البحر الأحمر</option>
          <option value="beheira">البحيرة</option>
          <option value="fayoum">الفيوم</option>
          <option value="gharbia">الغربية</option>
          <option value="ismailia">الإسماعيلية</option>
          <option value="monufia">المنوفية</option>
          <option value="minya">المنيا</option>
          <option value="qalyubia">القليوبية</option>
          <option value="new_valley">الوادي الجديد</option>
          <option value="suez">السويس</option>
          <option value="aswan">أسوان</option>
          <option value="assiut">أسيوط</option>
          <option value="beni_suef">بني سويف</option>
          <option value="port_said">بورسعيد</option>
          <option value="damietta">دمياط</option>
          <option value="sharqia">الشرقية</option>
          <option value="south_sinai">جنوب سيناء</option>
          <option value="kafr_el_sheikh">كفر الشيخ</option>
          <option value="matrouh">مطروح</option>
          <option value="luxor">الأقصر</option>
          <option value="qena">قنا</option>
          <option value="north_sinai">شمال سيناء</option>
          <option value="sohag">سوهاج</option>
          <option value="other">محافظة أخرى</option>
        </select>
      </div>

      <!-- مسح الفلاتر -->
      <button class="clear-filters w-full text-center text-sm text-muted hover:text-gold-400 transition-colors py-2">
        مسح كل الفلاتر
      </button>
    </div>
  </template>

  <!-- =========================================================
       الفوتر Footer (مختصر، لأن الصفحة داخلية وليست الرئيسية)
       ========================================================= -->
  <footer class="border-t border-white/[0.06] mt-auto bg-ink">
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-muted">
      <span class="font-num">© 2026 دكان. جميع الحقوق محفوظة.</span>
      <div class="flex items-center gap-4">
        <a href="#" class="hover:text-gold-400 transition-colors">سياسة الخصوصية</a>
        <a href="#" class="hover:text-gold-400 transition-colors">الشروط والأحكام</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { db, collection, getDocs, query, where, orderBy } from './firebase-config.js';
    import { wireAuthHeader } from './auth-header.js';

    lucide.createIcons();
    wireAuthHeader();

    /* =========================================================
       جلب المنتجات الحقيقية من Firestore (مجموعة "products")
       بعد الجلب بتترتب الأحدث أولاً، والفلاتر والترتيب بيتطبقوا محلياً
       ========================================================= */
    let products = [];

    const categoryLabels = {
      mobiles: 'موبايلات', electronics: 'إلكترونيات', furniture: 'أثاث ومنزل', cars: 'سيارات', fashion: 'أزياء', other: 'أخرى',
    };
    const locationLabels = {
      cairo: 'القاهرة', giza: 'الجيزة', alex: 'الإسكندرية', dakahlia: 'الدقهلية',
      red_sea: 'البحر الأحمر', beheira: 'البحيرة', fayoum: 'الفيوم', gharbia: 'الغربية',
      ismailia: 'الإسماعيلية', monufia: 'المنوفية', minya: 'المنيا', qalyubia: 'القليوبية',
      new_valley: 'الوادي الجديد', suez: 'السويس', aswan: 'أسوان', assiut: 'أسيوط',
      beni_suef: 'بني سويف', port_said: 'بورسعيد', damietta: 'دمياط', sharqia: 'الشرقية',
      south_sinai: 'جنوب سيناء', kafr_el_sheikh: 'كفر الشيخ', matrouh: 'مطروح', luxor: 'الأقصر',
      qena: 'قنا', north_sinai: 'شمال سيناء', sohag: 'سوهاج',
      mansoura: 'المنصورة', // توافق مع منتجات قديمة اتنشرت قبل تحديث قائمة المحافظات
      other: 'محافظة أخرى',
    };
    const conditionBadge = { new: 'gold', used: 'violet' };

    async function loadProducts() {
      productGrid.innerHTML = `<p class="col-span-full text-center text-muted text-sm py-10">جاري تحميل المنتجات...</p>`;
      try {
        // بنعرض المنتجات "المنشورة" (status == approved) بس، اللي وافق عليها الأدمن من لوحة التحكم
        const q = query(collection(db, 'products'), where('status', '==', 'approved'), orderBy('createdAt', 'desc'));
        const snapshot = await getDocs(q);
        products = snapshot.docs.map((docSnap) => {
          const data = docSnap.data();
          return { id: docSnap.id, ...data, badgeColor: conditionBadge[data.condition] || 'violet' };
        });
      } catch (err) {
        console.error(err);
        products = [];
        productGrid.innerHTML = `<p class="col-span-full text-center text-rose-400 text-sm py-10">تعذر تحميل المنتجات، حاول تحدّث الصفحة.</p>`;
      }
      applyFilters();
    }

    // ============ توليد بطاقات المنتجات في الشبكة ============
    const productGrid = document.getElementById('productGrid');

    function renderProducts(list) {
      if (list.length === 0 && products.length === 0) return; // رسالة التحميل/الخطأ لسه ظاهرة

      productGrid.innerHTML = list.map((p) => `
        <a href="product.html?id=${p.id}" class="product-card bg-surface border border-white/[0.07] rounded-lg overflow-hidden flex flex-col transition-all hover:border-${p.badgeColor}-500/30 hover:-translate-y-1"
             data-id="${p.id}">
          <div class="aspect-square flex items-center justify-center border-b border-white/[0.07] bg-surface2 overflow-hidden">
            ${
              p.images && p.images[0]
                ? `<img src="${p.images[0]}" alt="${p.name}" class="w-full h-full object-cover" loading="lazy" />`
                : `<i data-lucide="image" class="w-8 h-8 text-muted"></i>`
            }
          </div>
          <div class="p-3 flex flex-col gap-1.5">
            <span class="text-xs w-fit px-2 py-0.5 rounded-full border border-${p.badgeColor}-500/40 text-${p.badgeColor}-${p.badgeColor === 'gold' ? '400' : '300'} bg-${p.badgeColor}-500/10">
              ${p.condition === 'new' ? 'جديد' : 'مستعمل'}
            </span>
            <h3 class="font-medium text-sm">${p.name}</h3>
            <p class="text-sm text-gold-400 font-num font-semibold">${Number(p.price).toLocaleString('en-US')} جنيه</p>
            <p class="text-xs text-muted flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> ${locationLabels[p.location] || ''}</p>
          </div>
        </a>
      `).join('');
      lucide.createIcons();
    }

    // ============ حالة الفلاتر الحالية ============
    const filterState = {
      condition: 'all',
      categories: new Set(),
      priceMin: null,
      priceMax: null,
      location: 'all',
    };

    // ============ حقن قالب الفلاتر داخل النسخة الديسكتوب والموبايل ============
    const filterTemplate = document.getElementById('filterTemplate');
    const desktopHolder = document.getElementById('filterPanelDesktop');
    const mobileHolder = document.getElementById('filterPanelMobile');

    desktopHolder.appendChild(filterTemplate.content.cloneNode(true));
    mobileHolder.appendChild(filterTemplate.content.cloneNode(true));

    // ============ ربط الأحداث بكل نسخة من الفلاتر (ديسكتوب وموبايل معاً) ============
    function wireFilterPanel(root) {
      // أزرار الحالة
      root.querySelectorAll('.condition-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          filterState.condition = btn.dataset.value;
          syncConditionButtons();
          applyFilters();
        });
      });

      // اختيار الأقسام
      root.querySelectorAll('.category-check').forEach((chk) => {
        chk.addEventListener('change', () => {
          chk.checked ? filterState.categories.add(chk.value) : filterState.categories.delete(chk.value);
          syncCategoryChecks();
          applyFilters();
        });
      });

      // نطاق السعر
      root.querySelector('.price-min').addEventListener('input', (e) => {
        filterState.priceMin = e.target.value ? Number(e.target.value) : null;
        syncPriceInputs();
        applyFilters();
      });
      root.querySelector('.price-max').addEventListener('input', (e) => {
        filterState.priceMax = e.target.value ? Number(e.target.value) : null;
        syncPriceInputs();
        applyFilters();
      });

      // المحافظة
      root.querySelector('.location-select').addEventListener('change', (e) => {
        filterState.location = e.target.value;
        syncLocationSelect();
        applyFilters();
      });

      // مسح الفلاتر
      root.querySelector('.clear-filters').addEventListener('click', () => {
        filterState.condition = 'all';
        filterState.categories.clear();
        filterState.priceMin = null;
        filterState.priceMax = null;
        filterState.location = 'all';
        syncAllFilterUI();
        applyFilters();
      });
    }

    wireFilterPanel(desktopHolder);
    wireFilterPanel(mobileHolder);

    // ============ مزامنة شكل عناصر الفلتر (الديسكتوب + الموبايل) مع الحالة الحالية ============
    function syncConditionButtons() {
      document.querySelectorAll('.condition-btn').forEach((btn) => {
        const active = btn.dataset.value === filterState.condition;
        btn.className = 'condition-btn px-3 py-1.5 rounded-full text-xs border transition-colors ' +
          (active ? 'border-gold-500/50 text-gold-400 bg-gold-500/10' : 'border-white/10 text-muted hover:border-gold-500/30');
      });
    }

    function syncCategoryChecks() {
      document.querySelectorAll('.category-check').forEach((chk) => {
        chk.checked = filterState.categories.has(chk.value);
      });
    }

    function syncPriceInputs() {
      document.querySelectorAll('.price-min').forEach((el) => (el.value = filterState.priceMin ?? ''));
      document.querySelectorAll('.price-max').forEach((el) => (el.value = filterState.priceMax ?? ''));
    }

    function syncLocationSelect() {
      document.querySelectorAll('.location-select').forEach((el) => (el.value = filterState.location));
    }

    function syncAllFilterUI() {
      syncConditionButtons();
      syncCategoryChecks();
      syncPriceInputs();
      syncLocationSelect();
    }

    // ============ رقاقات الفلاتر النشطة (Active Chips) ============
    const activeChips = document.getElementById('activeChips');
    const activeFilterCount = document.getElementById('activeFilterCount');

    function renderChips() {
      const chips = [];

      if (filterState.condition !== 'all') {
        chips.push({ label: filterState.condition === 'new' ? 'جديد' : 'مستعمل', onRemove: () => { filterState.condition = 'all'; } });
      }
      filterState.categories.forEach((cat) => {
        chips.push({ label: categoryLabels[cat], onRemove: () => filterState.categories.delete(cat) });
      });
      if (filterState.priceMin !== null || filterState.priceMax !== null) {
        chips.push({
          label: `السعر: ${filterState.priceMin ?? 0} - ${filterState.priceMax ?? '∞'}`,
          onRemove: () => { filterState.priceMin = null; filterState.priceMax = null; },
        });
      }
      if (filterState.location !== 'all') {
        chips.push({ label: locationLabels[filterState.location], onRemove: () => { filterState.location = 'all'; } });
      }

      activeChips.innerHTML = chips.map((c, i) => `
        <button data-chip-index="${i}" class="chip-remove flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs border border-gold-500/30 bg-gold-500/10 text-gold-300">
          ${c.label}
          <i data-lucide="x" class="w-3 h-3"></i>
        </button>
      `).join('');

      activeChips.querySelectorAll('.chip-remove').forEach((btn, i) => {
        btn.addEventListener('click', () => {
          chips[i].onRemove();
          syncAllFilterUI();
          applyFilters();
        });
      });

      lucide.createIcons();

      // تحديث عدّاد الفلاتر النشطة بجانب زرار "الفلاتر" في الموبايل
      if (chips.length > 0) {
        activeFilterCount.textContent = chips.length;
        activeFilterCount.classList.remove('hidden');
        activeFilterCount.classList.add('flex');
      } else {
        activeFilterCount.classList.add('hidden');
        activeFilterCount.classList.remove('flex');
      }
    }

    // ============ تطبيق الفلاتر على شبكة المنتجات ============
    const resultsCount = document.getElementById('resultsCount');
    const emptyState = document.getElementById('emptyState');

    function applyFilters() {
      let filtered = products.filter((p) => {
        if (filterState.condition !== 'all' && p.condition !== filterState.condition) return false;
        if (filterState.categories.size > 0 && !filterState.categories.has(p.category)) return false;
        if (filterState.priceMin !== null && p.price < filterState.priceMin) return false;
        if (filterState.priceMax !== null && p.price > filterState.priceMax) return false;
        if (filterState.location !== 'all' && p.location !== filterState.location) return false;
        return true;
      });

      // تطبيق الترتيب الحالي بعد الفلترة
      filtered = applySort(filtered);

      renderProducts(filtered);
      renderChips();

      resultsCount.textContent = `عرض ${filtered.length} منتج`;
      productGrid.classList.toggle('hidden', filtered.length === 0);
      emptyState.classList.toggle('hidden', filtered.length !== 0);
      emptyState.classList.toggle('flex', filtered.length === 0);
    }

    // ============ الترتيب (الأحدث / الأقل سعراً / الأعلى سعراً) ============
    const sortSelect = document.getElementById('sortSelect');

    function applySort(list) {
      const sorted = [...list];
      if (sortSelect.value === 'price-asc') sorted.sort((a, b) => a.price - b.price);
      else if (sortSelect.value === 'price-desc') sorted.sort((a, b) => b.price - a.price);
      // 'default' = الأحدث: نفس ترتيب المصفوفة الأصلي (الأحدث أولاً كافتراض)
      return sorted;
    }

    sortSelect.addEventListener('change', applyFilters);

    // ============ التشغيل الأولي عند فتح الصفحة ============
    // لو جاي من رابط فيه ?category=mobiles (مثلاً من روابط الأقسام في الصفحة الرئيسية)،
    // نطبّق فلتر القسم ده تلقائياً على طول
    const initialParams = new URLSearchParams(window.location.search);
    const categoryFromUrl = initialParams.get('category');
    if (categoryFromUrl && categoryLabels[categoryFromUrl]) {
      filterState.categories.add(categoryFromUrl);
    }
    const locationFromUrl = initialParams.get('location');
    if (locationFromUrl && locationLabels[locationFromUrl]) {
      filterState.location = locationFromUrl;
    }

    syncAllFilterUI();
    loadProducts();

    // ============ درج الفلاتر (موبايل/تابلت) ============
    const filterDrawer = document.getElementById('filterDrawer');
    const filterOverlay = document.getElementById('filterOverlay');

    function openDrawer() {
      filterDrawer.classList.add('open');
      filterOverlay.classList.add('open');
    }
    function closeDrawer() {
      filterDrawer.classList.remove('open');
      filterOverlay.classList.remove('open');
    }

    document.getElementById('openFilterDrawer').addEventListener('click', openDrawer);
    document.getElementById('closeFilterDrawer').addEventListener('click', closeDrawer);
    document.getElementById('applyFilterDrawer').addEventListener('click', closeDrawer);
    filterOverlay.addEventListener('click', closeDrawer);

    // ============ قائمة الهمبرجر التفاعلية (نفس منطق باقي صفحات الموقع) ============
    const menuToggle = document.getElementById('menuToggle');
    const mobileMenu = document.getElementById('mobileMenu');
    const menuIcon = document.getElementById('menuIcon');

    function setMenuState(open) {
      mobileMenu.classList.toggle('open', open);
      menuToggle.setAttribute('aria-expanded', String(open));
      menuIcon.setAttribute('data-lucide', open ? 'x' : 'menu');
      lucide.createIcons();
    }

    menuToggle.addEventListener('click', () => setMenuState(!mobileMenu.classList.contains('open')));
    mobileMenu.querySelectorAll('a, button').forEach((el) => el.addEventListener('click', () => setMenuState(false)));
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768 && mobileMenu.classList.contains('open')) setMenuState(false);
    });
  </script>

</body>
</html>
